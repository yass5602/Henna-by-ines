<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilotage — Henna by Inès</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="image/logo/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#FBF4EB;color:#241A14;font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  [hidden]{display:none!important}
  a{color:#A8542A}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0;line-height:1.2}

  /* ---- boutons ---- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #241A14;background:#241A14;color:#FBF4EB;border-radius:999px;padding:11px 20px;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
  .btn:hover{background:#A8542A;border-color:#A8542A;color:#FBF4EB}
  .btn.sec{background:transparent;color:#241A14;border-color:rgba(36,26,20,.28)}
  .btn.sec:hover{background:rgba(168,84,42,.1);color:#241A14;border-color:#A8542A}
  .btn.danger{background:transparent;color:#9B2C1F;border-color:rgba(155,44,31,.4)}
  .btn.danger:hover{background:#9B2C1F;color:#fff;border-color:#9B2C1F}
  .btn.vert{background:#1F6B5E;border-color:#1F6B5E}
  .btn.vert:hover{background:#175246;border-color:#175246}
  .btn.petit{padding:8px 14px;font-size:12px}
  .btn[disabled]{opacity:.55;cursor:default;pointer-events:none}
  .ico{width:34px;height:34px;padding:0;border-radius:50%;border:1px solid rgba(36,26,20,.22);background:#fff;cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico:hover{border-color:#A8542A;background:rgba(168,84,42,.08)}

  /* ---- connexion ---- */
  .centre{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .boite{width:100%;max-width:430px;background:#fff;border:1px solid rgba(36,26,20,.1);border-radius:24px;padding:36px 32px;box-shadow:0 18px 48px rgba(36,26,20,.08)}
  .boite .logo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid rgba(165,84,42,.35);display:block;margin:0 auto 14px}
  .boite h1{font-size:32px;text-align:center}
  .boite .sous{text-align:center;color:rgba(36,26,20,.62);font-size:14.5px;margin:6px 0 26px}
  .boite .btn{width:100%;padding:15px}
  .retour{display:block;text-align:center;margin-top:18px;font-size:14px}
  .champ{display:block;margin-bottom:16px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:rgba(36,26,20,.65)}
  .champ input,.champ select,.champ textarea{display:block;width:100%;margin-top:6px;padding:13px 15px;border:1px solid rgba(36,26,20,.22);border-radius:12px;background:#FBF4EB;
    font-size:16px;letter-spacing:0;text-transform:none;color:#241A14}
  .champ input:focus,.champ select:focus,.champ textarea:focus{outline:2px solid #A8542A;outline-offset:1px;background:#fff}
  .champ textarea{resize:vertical;min-height:84px;line-height:1.5}
  .aide{font-size:13px;color:rgba(36,26,20,.6);margin:-8px 0 16px;letter-spacing:0;text-transform:none}
  .erreur{background:rgba(155,44,31,.09);border:1px solid rgba(155,44,31,.3);color:#7A2016;border-radius:12px;padding:11px 14px;font-size:14px;margin:0 0 16px}
  .info{background:rgba(31,107,94,.09);border:1px solid rgba(31,107,94,.3);color:#175246;border-radius:12px;padding:12px 16px;font-size:14.5px}
  code{background:#F0E4D3;border-radius:6px;padding:1px 7px;font-size:.92em}

  /* ---- en-tête et onglets ---- */
  header.top{position:sticky;top:0;z-index:20;background:rgba(251,244,235,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(36,26,20,.1)}
  .top .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
  .top img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid rgba(165,84,42,.35)}
  .top .titre{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;line-height:1.1}
  .top .qui{font-size:12.5px;color:rgba(36,26,20,.6)}
  .top .actions{margin-left:auto;display:flex;gap:10px;align-items:center}
  main{max-width:1180px;margin:0 auto;padding:24px 20px 90px}
  .onglets{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:none}
  .onglets::-webkit-scrollbar{display:none}
  .onglets button{flex:0 0 auto;cursor:pointer;border:1px solid rgba(36,26,20,.22);background:rgba(255,255,255,.7);border-radius:999px;padding:12px 20px;font-size:14.5px;font-weight:500;white-space:nowrap}
  .onglets button:hover{border-color:#A8542A}
  .onglets button[aria-selected="true"]{background:#241A14;border-color:#241A14;color:#FBF4EB}
  .onglets .nb{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:#A8542A;color:#fff;font-size:12px;line-height:20px;text-align:center}
  .chargement{padding:60px 0;text-align:center;color:rgba(36,26,20,.55)}
  .entete{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .entete h2{font-size:30px}
  .entete p{margin:4px 0 0;color:rgba(36,26,20,.65);font-size:15px;max-width:62ch}
  .actions-ligne{display:flex;gap:10px;flex-wrap:wrap}

  /* ---- tableau de bord ---- */
  .carte{background:#fff;border:1px solid rgba(36,26,20,.1);border-radius:20px;padding:20px 22px}
  .carte h3{font-size:22px;margin-bottom:4px}
  .carte .leg{font-size:13.5px;color:rgba(36,26,20,.6);margin:0 0 14px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid rgba(36,26,20,.1);border-radius:20px;padding:18px 22px}
  .kpi .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(36,26,20,.55)}
  .kpi .lab span{display:block;letter-spacing:0;text-transform:none;font-size:13.5px;margin-top:1px}
  .kpi .val{font:600 40px/1.15 'Cormorant Garamond',serif;color:#1F6B5E;margin:8px 0 4px}
  .kpi .delta{font-size:13.5px;font-weight:500}
  .kpi .delta.up{color:#1F6B5E}.kpi .delta.down{color:#9B2C1F}.kpi .delta.eq{color:rgba(36,26,20,.55)}
  .kpi .sous{font-size:13.5px;color:rgba(36,26,20,.65);margin-top:8px;padding-top:8px;border-top:1px solid rgba(36,26,20,.08)}
  .duo{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:16px}
  .toggle{display:inline-flex;border:1px solid rgba(36,26,20,.22);border-radius:999px;overflow:hidden;background:#fff}
  .toggle button{border:0;background:transparent;padding:8px 14px;font-size:13px;cursor:pointer}
  .toggle button[aria-pressed="true"]{background:#241A14;color:#FBF4EB}
  .chart-tete{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .legende{display:flex;gap:16px;font-size:13px;color:rgba(36,26,20,.7);margin:0 0 8px}
  .legende i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  svg.chart{width:100%;height:auto;display:block}
  svg.chart text{font:11px Jost,system-ui,sans-serif;fill:rgba(36,26,20,.6)}
  .barre-l{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
  .barre-l .piste{height:12px;background:#F0E4D3;border-radius:999px;overflow:hidden}
  .barre-l .piste i{display:block;height:100%;background:#1F6B5E;border-radius:999px}
  .barre-l .nom{overflow-wrap:anywhere}
  .barre-l .mt{font-weight:500;white-space:nowrap}
  .vide{background:rgba(255,255,255,.6);border:1px dashed rgba(36,26,20,.28);border-radius:16px;padding:22px;text-align:center;color:rgba(36,26,20,.65);font-size:14.5px}
  .annee{margin-top:16px;display:flex;gap:26px;flex-wrap:wrap;font-size:14.5px;color:rgba(36,26,20,.75)}
  .annee strong{font-weight:500;color:#241A14}

  /* à confirmer (PayPal) */
  .pending{background:rgba(197,139,62,.13);border:1px solid rgba(197,139,62,.5);border-radius:20px;padding:18px 20px;margin-bottom:18px}
  .pending h3{font-size:22px;display:flex;align-items:center;gap:10px}
  .pending p{margin:4px 0 12px;font-size:14.5px;color:rgba(36,26,20,.72)}
  .badge{display:inline-block;background:#A8542A;color:#fff;font:500 12px/20px Jost,sans-serif;border-radius:999px;padding:0 9px}
  .cmd{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;margin-top:8px;flex-wrap:wrap}
  .cmd .qui{flex:1 1 260px;min-width:0}
  .cmd .qui strong{font-weight:500}
  .cmd .qui span{display:block;font-size:13px;color:rgba(36,26,20,.62);overflow-wrap:anywhere}
  .cmd .mt{font:600 22px/1 'Cormorant Garamond',serif;color:#1F6B5E}
  .cmd .acts{display:flex;gap:8px}

  /* ---- listes (agenda, recettes) ---- */
  .jour-t{font:600 22px/1.2 'Cormorant Garamond',serif;color:#A8542A;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid rgba(36,26,20,.12);text-transform:capitalize}
  .rdv{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid rgba(36,26,20,.1);border-radius:16px;padding:12px 16px;margin-bottom:8px}
  .rdv .h{flex:0 0 96px;font-size:14px;font-weight:500;color:#1F6B5E}
  .rdv .c{flex:1;min-width:0}
  .rdv .c strong{font-weight:500;font-size:16px}
  .rdv .c span{display:block;font-size:13.5px;color:rgba(36,26,20,.65);overflow-wrap:anywhere}
  .rdv .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .filtres{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .filtres select,.filtres input{padding:11px 14px;border:1px solid rgba(36,26,20,.22);border-radius:999px;background:#fff;font-size:15px}
  .filtres input{min-width:200px;flex:1 1 200px}
  .mv{display:grid;grid-template-columns:96px 1fr auto auto;gap:12px;align-items:center;background:#fff;border:1px solid rgba(36,26,20,.1);border-radius:14px;padding:10px 14px;margin-bottom:8px}
  .mv .d{font-size:14px;color:rgba(36,26,20,.7)}
  .mv .p strong{font-weight:500}
  .mv .p span:not(.puce){display:block;font-size:13px;color:rgba(36,26,20,.6);overflow-wrap:anywhere}
  .mv .m{font:600 22px/1 'Cormorant Garamond',serif;white-space:nowrap}
  .mv .m.r{color:#1F6B5E}.mv .m.dep{color:#9B2C1F}
  .mv .acts{display:flex;gap:6px}
  .puce{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:#F0E4D3;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px;color:#6B4A1F}
  .totaux{display:flex;gap:22px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px;padding:14px 18px;background:#fff;border:1px solid rgba(36,26,20,.1);border-radius:16px;font-size:15px}
  .totaux strong{font:600 22px/1 'Cormorant Garamond',serif;margin-left:6px}

  /* ---- calendrier ---- */
  .cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .cal-nav h2{font-size:28px;min-width:200px;text-transform:capitalize}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .jn{font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:center;color:rgba(36,26,20,.55);padding:4px 0}
  .cell{position:relative;min-height:104px;border:1px solid rgba(36,26,20,.1);background:#fff;border-radius:12px;padding:6px 7px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .cell:hover{border-color:#A8542A}
  .cell.hors{background:rgba(255,255,255,.5);color:rgba(36,26,20,.45)}
  .cell.auj{border:2px solid #A8542A}
  .cell .dn{font-size:13.5px;font-weight:500}
  .cell.auj .dn{background:#A8542A;color:#fff;border-radius:999px;padding:0 7px;align-self:flex-start}
  .chip{display:block;font-size:12px;line-height:1.3;background:rgba(31,107,94,.14);color:#175246;border-radius:6px;padding:1px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more{font-size:11.5px;color:rgba(36,26,20,.6)}
  .cal-rec{margin-top:auto;font-size:11.5px;font-weight:500;color:#1F6B5E}
  .points{display:none}

  /* ---- google ---- */
  .gframe{width:100%;height:640px;border:1px solid rgba(36,26,20,.12);border-radius:16px;background:#fff}

  /* ---- modale ---- */
  .voile{position:fixed;inset:0;z-index:100;background:rgba(36,26,20,.55);display:flex;align-items:center;justify-content:center;padding:18px}
  .modale{background:#FBF4EB;border-radius:24px;width:100%;max-width:600px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .modale .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 26px 6px}
  .modale .mh h2{font-size:26px}
  .modale .mx{border:0;background:transparent;font-size:30px;line-height:1;cursor:pointer;padding:4px 10px;margin-right:-10px}
  .modale .mb{padding:10px 26px 6px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modale .mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:16px 26px 22px;border-top:1px solid rgba(36,26,20,.1)}
  .modale .mf .gauche{margin-right:auto}
  .deux{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .case{display:flex;align-items:center;gap:10px;margin:2px 0 16px;font-size:15px;cursor:pointer}
  .case input{width:20px;height:20px;accent-color:#A8542A}
  .sens{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .sens label{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid rgba(36,26,20,.22);border-radius:12px;background:#fff;cursor:pointer;font-weight:500}
  .sens input{accent-color:#A8542A}
  .sens label:has(input:checked){border-color:#A8542A;background:rgba(168,84,42,.08)}
  .mini{margin:0 0 12px;padding:10px 14px;background:#fff;border-radius:12px;font-size:14.5px}
  .mini+.mini{margin-top:-4px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;max-width:min(92vw,460px);padding:13px 22px;border-radius:999px;background:#241A14;color:#FBF4EB;font-size:14.5px;
    box-shadow:0 10px 30px rgba(36,26,20,.3);opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
  #toast.on{opacity:1}
  #toast.err{background:#9B2C1F}

  @media (max-width:860px){
    .kpis{grid-template-columns:1fr}
    .duo{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .top .in{padding:10px 14px;gap:10px}
    .top .qui{display:none}
    #chart-zone{overflow-x:auto;margin:0 -6px;padding:0 6px}
    #chart-zone svg.chart{min-width:600px}
    .top .titre{font-size:18px}
    .top .actions{gap:6px}
    .top .actions .btn{padding:9px 12px;font-size:11.5px;letter-spacing:.06em}
    .top img{width:38px;height:38px}
    main{padding:18px 14px 90px}
    .entete h2{font-size:25px}
    .kpi .val{font-size:34px}
    .cal{gap:3px}
    .cell{min-height:62px;padding:4px;align-items:center}
    .cell .dn{font-size:13px}
    .cell .chip,.cell .more{display:none}
    .cell .points{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
    .cell .points i{width:7px;height:7px;border-radius:50%;background:#1F6B5E}
    .cell .cal-rec{font-size:10px;white-space:nowrap;letter-spacing:-.02em}
    .cal-nav h2{font-size:23px;min-width:0;flex:1}
    .mv{grid-template-columns:1fr auto;grid-template-areas:"p m" "d acts"}
    .mv .p{grid-area:p}.mv .m{grid-area:m}.mv .d{grid-area:d}.mv .acts{grid-area:acts;justify-content:flex-end}
    .rdv{flex-wrap:wrap}
    .rdv .h{flex:0 0 100%}
    .rdv .acts{width:100%;justify-content:flex-start}
    .barre-l{grid-template-columns:1fr auto;grid-template-areas:"n m" "p p"}
    .barre-l .nom{grid-area:n}.barre-l .mt{grid-area:m}.barre-l .piste{grid-area:p}
    .gframe{height:520px}
    .voile{padding:0;align-items:flex-end}
    .modale{max-width:none;border-radius:24px 24px 0 0;max-height:94vh;max-height:94dvh}
    .modale .mh{padding:18px 18px 4px}.modale .mb{padding:8px 18px 4px}
    .modale .mf{padding:14px 18px calc(18px + env(safe-area-inset-bottom))}
    .modale .mf .btn{flex:1 1 auto}
    .deux{grid-template-columns:1fr}
    .boite{padding:30px 22px}
    .totaux{justify-content:space-between}
  }
</style>
<script src="config.js"></script>
<script src="site-data.js"></script>
</head>
<body>

<!-- Service pas encore configuré -->
<section id="v-config" class="centre" hidden>
  <div class="boite" style="max-width:520px">
    <img class="logo" src="image/logo/LOGO.jpeg" alt="Henna by Inès">
    <h1>Pilotage</h1>
    <p class="sous">La connexion Supabase n'est pas encore renseignée.</p>
    <div class="info">Suivez d'abord <code>ADMIN-SETUP.md</code> (projet Supabase, puis URL et clé dans <code>config.js</code>), puis <code>supabase-pilotage.sql</code>.</div>
    <a class="retour" href="index.html">← Retour au site</a>
  </div>
</section>

<!-- Connexion -->
<section id="v-login" class="centre" hidden>
  <form class="boite" id="f-login" autocomplete="on">
    <img class="logo" src="image/logo/LOGO.jpeg" alt="Henna by Inès">
    <h1>Pilotage</h1>
    <p class="sous">Agenda, recettes et tableau de bord.</p>
    <p class="erreur" id="login-err" hidden></p>
    <label class="champ">Adresse e-mail
      <input type="email" id="login-email" required autocomplete="username" inputmode="email" autocapitalize="off">
    </label>
    <label class="champ">Mot de passe
      <input type="password" id="login-pw" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn" id="login-btn">Se connecter</button>
    <a class="retour" href="index.html">← Retour au site</a>
  </form>
</section>

<!-- Application -->
<section id="v-app" hidden>
  <header class="top">
    <div class="in">
      <img src="image/logo/LOGO.jpeg" alt="">
      <div>
        <div class="titre">Pilotage</div>
        <div class="qui" id="qui"></div>
      </div>
      <div class="actions">
        <a class="btn sec petit" href="admin.html">Admin</a>
        <button type="button" class="btn sec petit" id="b-logout">Déconnexion</button>
      </div>
    </div>
  </header>
  <main>
    <div class="onglets" role="tablist" id="onglets">
      <button type="button" role="tab" data-tab="dash" aria-selected="true">Tableau de bord</button>
      <button type="button" role="tab" data-tab="cal" aria-selected="false">Calendrier</button>
      <button type="button" role="tab" data-tab="agenda" aria-selected="false">Agenda</button>
      <button type="button" role="tab" data-tab="fin" aria-selected="false" id="t-fin">Recettes &amp; dépenses</button>
      <button type="button" role="tab" data-tab="google" aria-selected="false">Google Agenda</button>
    </div>
    <div id="panneau"><div class="chargement">Chargement…</div></div>
  </main>
</section>

<div id="toast" role="status"></div>
<div id="modal" class="voile" hidden></div>

<script src="pilotage.js"></script>
</body>
</html>
